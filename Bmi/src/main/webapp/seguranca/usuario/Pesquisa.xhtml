<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="titulo">BMI</ui:define>

	<ui:define name="corpo">
		<h:form>
			<h1>Boletim Mensal Informativo</h1>
			<p:messages autoUpdate="true" />
			<p:toolbar style="margin-top: 20px">

				<p:toolbarGroup align="left">
					<p:button type="button" value="Novo" icon="pi pi-plus"
						outcome="/seguranca/usuario/Cadastro" />
					<p:commandButton value="Pesquisar"
						action="#{usuarioBean.pesquisar}" update="@form" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:panelGrid columns="6" id="painel"
				style="width: 100%; margin-top: 20px" columnClasses="rotulo, campo">
				<p:outputLabel for="nome" value="Nome" />
				<p:inputText id="nome" value="#{usuarioBean.nome}" size="80" />
				<p:outputLabel value="Empresa" for="filtroEmp" />
				<p:selectOneMenu id="filtroEmp" value="#{boletimBean.filtroEmpresa}">

					<f:selectItem itemLabel="Selecione a empresa" />
					<f:selectItems value="#{principalBean.listaEmpresa}"
						var="filtroEmp" itemValue="#{filtroEmp}" itemLabel="#{filtroEmp}" />
				</p:selectOneMenu>
			</p:panelGrid>
			<p:dataTable id="listaUsuarios" var="item"
				value="#{usuarioBean.usuarios}"
				emptyMessage="Usuario não encontrado" paginator="true" rows="20"
				paginatorAlwaysVisible="false">
				<p:column style="width: 10px; text-align: center">
					<p:button icon="ui-icon-pencil" title="Editar"
						outcome="/seguranca/usuario/Cadastro">
						<f:param name="idStr" value="#{item.id}" />
					</p:button>
				</p:column>
				<p:column headerText="Nome" style="text-align: center; width: 100px">
					<h:outputText value="#{item.nome}" />
				</p:column>
				<p:column headerText="Empresa"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.empresa}" />
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
