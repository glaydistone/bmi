<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="titulo">BMI</ui:define>

	<ui:define name="corpo">
		<h:form>

			<h1>Boletim Mensal Informativo</h1>
			<p:messages autoUpdate="true" />
			<p:toolbar style="margin-top: 20px">
				<p:toolbarGroup align="right">
					<p:commandButton value="Pesquisar"
						action="#{boletimBean.pesquisar}" update="@form" />
				</p:toolbarGroup>
			</p:toolbar>

			<p:panelGrid columns="6" id="painel"
				style="width: 100%; margin-top: 20px" columnClasses="rotulo, campo">

				<p:outputLabel value="Empresa" for="filtroEmp" />
				<p:selectOneMenu id="filtroEmp" value="#{boletimBean.filtroEmpresa}">

					<f:selectItem itemLabel="Selecione a empresa" />
					<f:selectItems value="#{principalBean.listaEmpresa}"
						var="filtroEmp" itemValue="#{filtroEmp}" itemLabel="#{filtroEmp}" />
				</p:selectOneMenu>

				<p:outputLabel value="Tipo de Movimento" for="tipoMovimento" />
				<p:selectOneMenu id="tipoMovimento"
					value="#{boletimBean.filtroTipoMovimento}">
					<f:selectItem itemLabel="Selecione o tipo" />
					<f:selectItems value="#{boletimBean.tiposMovimento}"
						var="tipoMovimento" itemValue="#{tipoMovimento}"
						itemLabel="#{tipoMovimento.descricao}" />
				</p:selectOneMenu>

				<p:outputLabel for="mes" value="Mês referência" />
				<p:datePicker id="mes" value="#{boletimBean.filtroDataReferencia}"
					timeZone="GMT-3" pattern="MM/yyyy" view="month" 
					yearNavigator="true" />

			</p:panelGrid>
			<p:dataTable id="listaProdutos" var="item"
				value="#{boletimBean.boletins}"
				emptyMessage="Boletim não encontrado" paginator="true" rows="20"
				paginatorAlwaysVisible="false">
				<p:column style="width: 10px; text-align: center">
					<p:button outcome="/boletim/Consistencia" icon="ui-icon-pencil"
						title="Editar">
						<f:param name="idStr" value="#{item.id}" />
						<f:param name="modo" value="c" />
					</p:button>
				</p:column>
				<p:column headerText="Empresa"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.empresa.numero}" />
				</p:column>
				<p:column headerText="Razão social"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.empresa.razaoSocial}" />
				</p:column>
				<p:column headerText="Movimento"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.tipoMovimento.descricao}" />
				</p:column>
				<p:column headerText="Data de referência"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.dataReferencia}">
						<f:convertDateTime pattern="MM/yyyy" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
