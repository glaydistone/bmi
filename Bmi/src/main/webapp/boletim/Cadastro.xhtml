<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui">


	<ui:define name="corpo">
		<h:form>
			<f:metadata>
				<o:viewParam name="idStr" value="#{boletimBean.idStr}" />
			</f:metadata>
			<p:messages id="messages" autoUpdate="true" />

			<p:toolbar>
				<f:facet name="left">
					<p:button type="button" value="Novo" icon="pi pi-plus"
						outcome="/boletim/Cadastro" />
					<p:commandButton value="Clonar" icon="pi pi-copy" disabled="#{boletimBean.boletim.id == null}"
						action="#{boletimBean.clonar}" update="@form" />
					<p:button type="button" value="Pesquisar" icon="pi pi-search"
						outcome="/boletim/Pesquisa" />

					<span class="ui-separator"> <span
						class="ui-icon pi pi-ellipsis-v" />
					</span>

					<p:commandButton title="Salvar" icon="pi pi-save" value="Salvar" 
						action="#{boletimBean.salvar}" update="@form" />
					<p:commandButton type="button" title="Excluir" value="Excluir" disabled="#{boletimBean.boletim.id == null}"
						icon="pi pi-trash" />

					<p:button outcome="/boletim/Consistencia" icon="ui-icon-check"
						value="Consistir" title="Consistir" disabled="#{boletimBean.boletim.id == null}">
						<f:param name="idStr" value="#{boletimBean.boletim.id}" />
						<f:param name="modo" value="c" />
					</p:button>

				</f:facet>
			</p:toolbar>
			<p:panel header="Cadastro de BMI" toggleTitle="Cadastro de BMI">
				<p:outputLabel value="ID" />
				<p:outputLabel value="#{boletimBean.boletim.id}" />
				<h:panelGrid columns="6" style="width: 100%; margin-top: 20px"
					columnClasses="rotulo, campo">


					<p:outputLabel value="Empresa" for="emp" />
					<p:selectOneMenu id="emp" required="true"
						value="#{boletimBean.boletim.empresa}">
						<f:selectItem itemLabel="Selecione a empresa" />
						<f:selectItems value="#{principalBean.listaEmpresa}"
							var="filtroEmp" itemValue="#{filtroEmp}"
							itemLabel="#{filtroEmp.razaoSocial}" />
					</p:selectOneMenu>

					<p:outputLabel value="Tipo de Movimento" for="tipoMovimento" />
					<p:selectOneMenu id="tipoMovimento" required="true"
						value="#{boletimBean.boletim.tipoMovimento}">
						<f:selectItem itemLabel="Selecione o tipo" />
						<f:selectItems value="#{boletimBean.tiposMovimento}"
							var="tipoMovimento" itemValue="#{tipoMovimento}"
							itemLabel="#{tipoMovimento.descricao}" />
					</p:selectOneMenu>

					<p:outputLabel value="Mês referência" for="mes"/>
					<p:datePicker value="#{boletimBean.boletim.dataReferencia}" required="true"  timeZone="UTC-3"
						id="mes" view="month" pattern="MM/yyyy" yearNavigator="true" />
						
				</h:panelGrid>
				<p:tabView>
					<p:tab title="Dados Operacionais">
						<h:panelGrid border="0" columns="2"
							style="width: 100%;  margin-top: 20px">
							<p:panel header="Frota">
								<p:panelGrid columns="2" style="width: 100%; margin-top: 20px"
									columnClasses="rotulo, campo">
									<p:outputLabel value="Frota efetiva" for="frtEfetiva" />
									<p:inputNumber value="#{boletimBean.boletim.frotaEfetiva}"
										id="frtEfetiva" />


									<p:outputLabel value="Frota reserva" for="frtReserva" />
									<p:inputNumber value="#{boletimBean.boletim.frotaReserva}"
										id="frtReserva" />
								</p:panelGrid>
							</p:panel>
							<p:panel header="Quilometragem">
								<p:panelGrid columns="2" style="width: 100%; margin-top: 20px"
									columnClasses="rotulo, campo">
									<p:outputLabel value="Quilometragem Piso I" />
									<p:inputNumber
										value="#{boletimBean.boletim.quilometragem_piso1}"
										decimalPlaces="3" />
									<p:outputLabel value="Quilometragem Piso II" />
									<p:inputNumber
										value="#{boletimBean.boletim.quilometragem_piso2}"
										decimalPlaces="3" />
									<p:outputLabel value="Quilometragem Piso III" />
									<p:inputNumber
										value="#{boletimBean.boletim.quilometragem_piso3}"
										decimalPlaces="3" />
								</p:panelGrid>
							</p:panel>
						</h:panelGrid>
					</p:tab>

					<p:tab title="Custos Operacionais">
						<p:dataTable value="#{boletimBean.boletim.custosPessoal}"
							var="item" rowIndexVar="linha">
							<p:column headerText="Tipo"
								style="text-align: center; width: 100px">
								<h:outputText value="#{item.cargo.tipoCargo.descricao}" />
							</p:column>


							<p:column headerText="Cargo"
								style="text-align: center; width: 100px">
								<p:outputLabel value="#{item.cargo.descricao}" />
							</p:column>

							<p:column headerText="Elementos"
								style="text-align: center; width: 100px">
								<p:inputNumber size="5" value="#{item.elementos}" required="true" />
							</p:column>

							<p:column headerText="Salários"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.salarios}" required="true"
									decimalPlaces="2" decimalSeparator="," symbol="R$ " />
							</p:column>
							<p:column headerText="Prêmios"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.premios}" required="true"
									decimalPlaces="2" decimalSeparator="," symbol="R$ " />
							</p:column>
							<p:column headerText="Horas extras"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.horasExtras}" required="true"
									decimalPlaces="2" decimalSeparator="," symbol="R$ " />
							</p:column>
							<p:column headerText="Outros"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.outrosPagamentos}" required="true"
									decimalPlaces="2" decimalSeparator="," symbol="R$ " />
							</p:column>
							<p:column headerText="Encargos"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.encargosSociais}" required="true"
									decimalPlaces="2" decimalSeparator="," symbol="R$ " />
							</p:column>
						</p:dataTable>
					</p:tab>
					<p:tab title="Despesas Gerais">
						<p:dataTable value="#{boletimBean.boletim.despesasGerais}"
							var="item" rowIndexVar="linha">
							<p:column headerText="Categoria"
								style="text-align: center; width: 100px">
								<h:outputText
									value="#{item.tipoDespesa.categoriaDespesa.descricao}" />
							</p:column>


							<p:column headerText="tipo"
								style="text-align: center; width: 100px">
								<p:outputLabel value="#{item.tipoDespesa.descricao}" />
							</p:column>

							<p:column headerText="Valor"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.valor}" decimalPlaces="2" required="true"
									decimalSeparator="," symbol="R$ " />
							</p:column>
						</p:dataTable>
					</p:tab>
					<p:tab title="Receita e imobilizado">
						<p:dataTable value="#{boletimBean.boletim.receitasImobilizado}"
							var="item" rowIndexVar="linha">
							<p:column headerText="Categoria"
								style="text-align: center; width: 100px">
								<h:outputText
									value="#{item.tipoReceitaImobilizado.categoriaReceitaImobilizado.descricao}" />
							</p:column>


							<p:column headerText="tipo"
								style="text-align: center; width: 100px">
								<p:outputLabel value="#{item.tipoReceitaImobilizado.descricao}" />
							</p:column>

							<p:column headerText="Valor"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.valor}" decimalPlaces="2" required="true"
									decimalSeparator="," symbol="R$ " />
							</p:column>

							<p:column headerText="Descricao"
								style="text-align: center; width: 100px">
								<p:inputText size="80" value="#{item.descricao}" />
							</p:column>
						</p:dataTable>
					</p:tab>
					<p:tab title="Frota de apoio">
						<p:dataTable value="#{boletimBean.boletim.frotasApoio}" var="item"
							rowIndexVar="linha">
							<p:column headerText="Tipo"
								style="text-align: center; width: 100px">
								<h:outputText value="#{item.tipoVeiculoApoio.descricao}" />
							</p:column>

							<p:column headerText="Quilometragem"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.quilometragem}" required="true"
									decimalPlaces="2" decimalSeparator="," />
							</p:column>

							<p:column headerText="Valor"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.valor}" decimalPlaces="2" required="true"
									decimalSeparator="," symbol="R$ " />
							</p:column>

						</p:dataTable>
					</p:tab>
					<p:tab title="Materiais">
						<p:dataTable value="#{boletimBean.boletim.materiais}" var="item"
							rowIndexVar="linha">
							<p:column headerText="Categoria"
								style="text-align: center; width: 100px">
								<h:outputText
									value="#{item.tipoMaterial.categoriaMaterial.descricao}" />
							</p:column>
							<p:column headerText="tipo"
								style="text-align: center; width: 100px">
								<p:outputLabel value="#{item.tipoMaterial.descricao}" />
							</p:column>
							<p:column headerText="Quantidade"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.quantidade}" required="true"
									decimalPlaces="3" decimalSeparator="," />
							</p:column>
							<p:column headerText="Valor"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.valor}" decimalPlaces="2" required="true"
									decimalSeparator="," symbol="R$ " />
							</p:column>
						</p:dataTable>

					</p:tab>
					<p:tab title="Serviços">
						<p:dataTable value="#{boletimBean.boletim.servicos}" var="item"
							rowIndexVar="linha">
							<p:column headerText="tipo"
								style="text-align: center; width: 100px">
								<p:outputLabel value="#{item.tipoServico.descricao}" />
							</p:column>

							<p:column headerText="Quantidade"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.quantidade}" required="true"
									decimalPlaces="3" decimalSeparator="," />
							</p:column>

							<p:column headerText="Valor"
								style="text-align: center; width: 100px">
								<p:inputNumber size="15" value="#{item.valor}" decimalPlaces="2" required="true"
									decimalSeparator="," symbol="R$ " />
							</p:column>
							<p:column headerText="Descricao"
								style="text-align: center; width: 100px">
								<p:inputText size="80" value="#{item.descricao}" />
							</p:column>

						</p:dataTable>
					</p:tab>
				</p:tabView>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
