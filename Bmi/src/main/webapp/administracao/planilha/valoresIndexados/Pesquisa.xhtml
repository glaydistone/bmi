<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="titulo">BMI</ui:define>

	<ui:define name="corpo">
		<h:form>

			<p:messages autoUpdate="true" />
			<p:toolbar style="margin-top: 20px">
				<f:facet name="left">
					<p:button type="button" icon="pi pi-plus" title="incluir"
						value="Novo" outcome="/planilha/valoresIndexados/Cadastro" />
					<p:commandButton title="pesquisar" value="Pesquisar"
						action="#{planilhaIndexadosBean.pesquisar}" icon="pi pi-search"
						update="@form" />
				</f:facet>
			</p:toolbar>

			<p:panel columns="6" id="painel" header="Critérios de seleção"
				style="width: 100%; margin-top: 20px" columnClasses="rotulo, campo">
				<p:outputLabel for="mes" value="Mês referência" />
				<p:datePicker id="mes"
					value="#{planilhaIndexadosBean.filtroDataReferencia}"
					timeZone="UTC-3" view="month" pattern="MM/yyyy"
					yearNavigator="true" />

			</p:panel>
			<p:dataTable id="lista" var="item"
				value="#{planilhaIndexadosBean.planilhas}"
				emptyMessage="Parâmetros não encontrados" paginator="true" rows="20"
				paginatorAlwaysVisible="false">
				<p:column style="width: 10px; text-align: center">
					<p:button outcome="/planilha/valoresIndexados/Cadastro" icon="ui-icon-pencil"
						title="Editar">
						<f:param name="idStr" value="#{item.id}" />
					</p:button>
				</p:column>
				<p:column headerText="Tipo de movimento"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.tipoMovimento.descricao}">
						<f:convertDateTime pattern="MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column headerText="Data de referência"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.dataReferencia}">
						<f:convertDateTime pattern="MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column headerText="Despesas Administrativas"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.despesaAdministrativa}">
						<f:convertNumber pattern="#0.000" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="Taxas e tributos"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.taxasTributos}">
						<f:convertNumber pattern="#0.000" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="Peças e serviços de terceitos"
					style="text-align: center; width: 100px">
					<h:outputText value="#{item.servicosPecas}">
						<f:convertNumber pattern="#0.000" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
